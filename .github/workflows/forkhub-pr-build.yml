name: forkhub pr-build

# Try-builds for the open upstream PR that carries this catalog's first
# own intent-patch (Natively PR #661: exclude sourcemaps). Two linux
# flavors per run, published to THIS repo's releases, with one rolling
# comment on the upstream PR linking both:
#   pr-only — stock upstream + maps intent only (exactly what upstream
#             would merge; proves the intent is self-contained)
#   full    — stock + with-fh forkhub-support (pinned ref) + maps intent
#             (the complete ForkHub-enabled build)
#
# Required secret: UPSTREAM_COMMENT_TOKEN — a PAT with `public_repo`
# scope, so this workflow can (create/)update the comment on the
# UPSTREAM repo's PR. Absent: builds still publish; commenting is
# skipped with a warning (add it in Settings → Secrets → Actions).

on:
  push:
    paths:
      - "repos/github.com/natively-ai-assistant/natively-cluely-ai-assistant/**"
      - ".github/workflows/forkhub-pr-build.yml"
  workflow_dispatch:
    inputs:
      pr:
        description: "Upstream PR number to build for"
        required: false
        default: "661"
      tag:
        description: "Upstream tag to build (empty = newest stable)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the flavor release already exists"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: pr-build ${{ matrix.flavor }} (linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [pr-only, full]
    steps:
      - uses: actions/checkout@v6
        with:
          path: catalog

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve upstream tag
        id: tag
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            URL="https://github.com/Natively-AI-assistant/natively-cluely-ai-assistant.git"
            TAG=$(git ls-remote --tags --sort=-v:refname "$URL" \
              | grep -io 'refs/tags/v[^^{}]*' | cut -d/ -f3 | grep -Ev -- '-(beta|alpha|rc|preview|nightly|pr)[.-]' | head -1 || true)
            [ -n "$TAG" ] || { echo "::error::no stable upstream tag found"; exit 1; }
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone upstream + apply intent stack
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/app" && mkdir -p "$GITHUB_WORKSPACE/app"
          git clone --depth 1 --branch "${{ steps.tag.outputs.tag }}" \
            https://github.com/Natively-AI-assistant/natively-cluely-ai-assistant.git app
          TDIR="$GITHUB_WORKSPACE/catalog/repos/github.com/natively-ai-assistant/natively-cluely-ai-assistant"
          if [ "${{ matrix.flavor }}" = "full" ]; then
            # Dependency on with-fh/.forkhub (pinned in the maps INTENT):
            # full builds carry the complete ForkHub stack under the maps fix.
            REF=$(grep -oE '`[0-9a-f]{7,40}`' "$TDIR/patches/natively-pkg-no-maps-8dedeb5a/INTENT.md" | head -1 | tr -d '`')
            [ -n "$REF" ] || REF="f797d1a"
            echo "full flavor: with-fh support at $REF"
            curl -fsSL "https://raw.githubusercontent.com/with-fh/.forkhub/$REF/repos/github.com/natively-ai-assistant/natively-cluely-ai-assistant/patches/natively-forkhub-support-f276ae13/reference.diff" \
              -o /tmp/withfh-support.diff
            git -C "$GITHUB_WORKSPACE/app" apply --check /tmp/withfh-support.diff
            git -C "$GITHUB_WORKSPACE/app" apply /tmp/withfh-support.diff
          fi
          MAPS="$TDIR/patches/natively-pkg-no-maps-8dedeb5a/reference.diff"
          if ! git -C "$GITHUB_WORKSPACE/app" apply --check "$MAPS"; then
            echo "::error::maps intent no longer applies — upstream may have merged PR #${{ inputs.pr || '661' }} (retire the patch instead of re-deriving; see INTENT.md)"
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE/app" apply "$MAPS"

      - name: Native prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update >>/tmp/apt.log 2>&1 || true
          sudo apt-get install -y build-essential python3 pkg-config libsecret-1-dev libasound2-dev >>/tmp/apt.log 2>&1 || true

      - name: Install + build + pack AppImage
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/app"
          npm ci
          export PATH="$PWD/node_modules/.bin:$PATH"
          if [ "${{ matrix.flavor }}" = "full" ]; then
            # Fork provenance version for the full flavor (distinct owner
            # suffix — never collides with with-fh's with-fh.N line).
            BASE=$(printf '%s' "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
            N=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' \
              | grep -cE "^v${BASE}-fh\\.imbios\\.[0-9]+\$" || true)
            VER="${BASE}-fh.imbios.$((N + 1))"
            npm pkg set "version=$VER"
            echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          else
            # pr-only keeps the stock version: exactly what upstream merges.
            VER=$(printf '%s' "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
            echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          fi
          npm run build
          npm run build:electron
          npm run build:native || echo "::warning::native module build failed; continuing without it"
          find dist dist-electron node_modules -name '*.map' -delete || true
          ./node_modules/.bin/electron-builder --linux AppImage --publish never

      - name: Publish flavor release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$GITHUB_WORKSPACE/app/release"/*.AppImage "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
          mv "$GITHUB_WORKSPACE/app/release"/latest-linux.yml "$GITHUB_WORKSPACE/dist/" 2>/dev/null || true
          [ -n "$(ls -A "$GITHUB_WORKSPACE/dist")" ] || { echo "::error::no artifacts packed"; exit 1; }
          if [ "${{ matrix.flavor }}" = "full" ]; then
            TAG="v$APP_VERSION"
          else
            TAG="natively-pr${{ inputs.pr || '661' }}-pronly-${{ steps.tag.outputs.tag }}"
          fi
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum * > SHA256SUMS || shasum -a 256 * > SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${{ inputs.force }}" != "true" ]; then
              echo "$TAG exists and force=false; uploading into it"
            fi
            # shellcheck disable=SC2086
            (cd "$GITHUB_WORKSPACE/dist" && gh release upload "$TAG" * --repo "$GITHUB_REPOSITORY" --clobber)
          else
            gh release create "$TAG" "$GITHUB_WORKSPACE"/dist/* --repo "$GITHUB_REPOSITORY" \
              --title "Natively PR #${{ inputs.pr || '661' }} (${{ matrix.flavor }}) @ ${{ steps.tag.outputs.tag }}" \
              --notes "Try-build for upstream PR #${{ inputs.pr || '661' }} (${{ matrix.flavor }} flavor). Not for general use."
          fi
          mkdir -p /tmp/prlink
          printf '%s' "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" > "/tmp/prlink/${{ matrix.flavor }}-url.txt"
          printf '%s' "$TAG" > "/tmp/prlink/${{ matrix.flavor }}-tag.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: pr-build-link-${{ matrix.flavor }}
          path: /tmp/prlink/
          if-no-files-found: error

  comment:
    name: update upstream PR comment
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: pr-build-link-*
          path: /tmp/prlinks
          merge-multiple: true

      - name: Create or update the rolling PR comment
        env:
          COMMENT_TOKEN: ${{ secrets.UPSTREAM_COMMENT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$COMMENT_TOKEN" ]; then
            echo "::warning::UPSTREAM_COMMENT_TOKEN not set — skipping upstream PR comment (add a PAT with public_repo scope in Settings → Secrets → Actions)."
            exit 0
          fi
          UPSTREAM="Natively-AI-assistant/natively-cluely-ai-assistant"
          PR="${{ inputs.pr || '661' }}"
          MARKER="<!-- imbios-forkhub-pr-build:$PR -->"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA="${{ github.sha }}"
          {
            echo "$MARKER"
            echo '## ForkHub try-builds'
            echo
            echo "Upstream PR #$PR — built from ImBIOS/.forkhub intent natively-pkg-no-maps-8dedeb5a @ $SHA ($DATE)."
            echo
            if [ -f /tmp/prlinks/pr-only-url.txt ]; then
              echo "- PR-only (stock + this change, exactly what upstream would merge): [$(cat /tmp/prlinks/pr-only-tag.txt)]($(cat /tmp/prlinks/pr-only-url.txt))"
            else
              echo "- PR-only: build did not publish (see the run)."
            fi
            if [ -f /tmp/prlinks/full-url.txt ]; then
              echo "- Full ForkHub (with-fh support + this change): [$(cat /tmp/prlinks/full-tag.txt)]($(cat /tmp/prlinks/full-url.txt))"
            else
              echo "- Full ForkHub: build did not publish (see the run)."
            fi
            echo "- Upstream-line builds: [with-fh/.forkhub releases](https://github.com/with-fh/.forkhub/releases)"
            echo
            echo '_Updated by ImBIOS/.forkhub pr-build workflow — one comment, edited in place._'
          } > /tmp/pr-comment.md
          EXISTING=$(GH_TOKEN="$COMMENT_TOKEN" gh api "repos/$UPSTREAM/issues/$PR/comments?per_page=100" \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id // empty")
          BODY_JSON=$(jq -Rs '{body: .}' /tmp/pr-comment.md)
          if [ -n "$EXISTING" ]; then
            printf '%s' "$BODY_JSON" | GH_TOKEN="$COMMENT_TOKEN" gh api "repos/$UPSTREAM/issues/comments/$EXISTING" \
              -X PATCH --input - --jq '.html_url'
          else
            GH_TOKEN="$COMMENT_TOKEN" gh pr comment "$PR" --repo "$UPSTREAM" --body-file /tmp/pr-comment.md
          fi
