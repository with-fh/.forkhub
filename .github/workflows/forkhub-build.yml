name: forkhub build

# Hard-coded reusable builder for ALL intent-patched targets in this .forkhub repo.
# Per-target customization lives in repos/<host>/<owner>/<repo>/build/ (BUILD.md,
# build.sh, CONSUME.md, triggers.md) — never in this file. Safe to leave as-is.
#
# Triggers: push to repos/**, daily schedule (upstream-release polling), manual.
# The per-target build/triggers.md records the USER-EXPLICIT trigger choice
# (an agent must ask the user; triggers affect token/compute spend). To change
# the poll cadence, edit the cron below.
#
# Trains: a target lists release trains in upstream.json:trains
# (e.g. ["stable", "nightly"]); the build matrix fans out to one job per
# (target, train). Absent trains means ["default"]: legacy newest-tag behavior.

on:
  push:
    paths:
      - "repos/**"
  schedule:
    # 00:00 UTC+7 — nightly check while ImBIOS sleeps. The skip gate below
    # means this builds only tags with no release yet; manual dispatch
    # (+ force) covers everything else.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Only build this target, e.g. github.com/owner/repo (empty = all)"
        required: false
        default: ""
      train:
        description: "Only build this train, e.g. stable (empty = all configured)"
        required: false
        default: ""
      force:
        description: "Rebuild even if this tag already has a release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.list.outputs.builds }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          set -euo pipefail
          FILTER="${{ inputs.target }}"
          TRAIN_FILTER="${{ inputs.train }}"
          BUILDS=$(for m in repos/*/*/*/manifest.json; do
            [ -f "$m" ] || continue
            t=$(dirname "$m" | sed 's|^repos/||')
            if [ -n "$FILTER" ] && [ "$t" != "$FILTER" ]; then continue; fi
            for train in $(jq -r '(.trains // ["default"])[]' "repos/$t/upstream.json"); do
              if [ -n "$TRAIN_FILTER" ] && [ "$train" != "$TRAIN_FILTER" ]; then continue; fi
              jq -n --arg t "$t" --arg train "$train" '{target: $t, train: $train}'
            done
          done | jq -cs .)
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.pair.target }} ${{ matrix.pair.train }}
    needs: [discover]
    if: needs.discover.outputs.builds != '[]'
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJson(needs.discover.outputs.builds) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: forkhub

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve upstream + patch stack
        id: ctx
        working-directory: forkhub
        run: |
          set -euo pipefail
          M="repos/${{ matrix.pair.target }}/manifest.json"
          U="repos/${{ matrix.pair.target }}/upstream.json"
          echo "upstream_url=$(jq -r .upstream_url "$U")" >> "$GITHUB_OUTPUT"
          echo "upstream_branch=$(jq -r '.upstream_main_branch // "main"' "$U")" >> "$GITHUB_OUTPUT"
          echo "order=$(jq -c .apply_order "$M")" >> "$GITHUB_OUTPUT"

      - name: "Clone upstream at latest tag (fallback: main branch)"
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build" && mkdir -p "$GITHUB_WORKSPACE/build"
          URL="${{ steps.ctx.outputs.upstream_url }}"
          # GHA runners have no SSH keys: normalize git@host:owner/repo
          # to https for public clones.
          URL=$(printf '%s' "$URL" | sed -e 's|^git@\([^:]*\):|https://\1/|')
          # Train selection: upstream.json:trains fans the matrix out to one
          # job per (target, train). Each train brings default tag filters
          # (EREs for grep -E); explicit tag_match_pattern /
          # tag_ignore_pattern apply on top. Train "default" preserves
          # legacy behavior: newest tag of any train.
          UJSON="$GITHUB_WORKSPACE/forkhub/repos/${{ matrix.pair.target }}/upstream.json"
          case "${{ matrix.pair.train }}" in
            nightly) TRAIN_MATCH='-nightly\.[0-9]{8}\.'; TRAIN_IGNORE="";;
            stable) TRAIN_MATCH=""; TRAIN_IGNORE='-(nightly|preview)\.[0-9]{8}\.|-pr\.';;
            *) TRAIN_MATCH=""; TRAIN_IGNORE="";;
          esac
          MATCH=$(jq -r '.tag_match_pattern // empty' "$UJSON")
          IGNORE=$(jq -r '.tag_ignore_pattern // empty' "$UJSON")
          [ -n "$MATCH" ] || MATCH="$TRAIN_MATCH"
          [ -n "$IGNORE" ] || IGNORE="$TRAIN_IGNORE"
          TAGS=$(git ls-remote --tags --sort=-v:refname "$URL" \
            | grep -io 'refs/tags/v[^^{}]*' | cut -d/ -f3 || true)
          # NOTE: the tag pool is case-insensitive (-i) so capital-V tags
          # (e.g. upstream Natively's V2.8.8) are visible, and the final
          # pick orders by lowercased version so the newest tag wins
          # regardless of case. Per-target MATCH/IGNORE patterns below stay
          # case-sensitive and still decide; uniform-lowercase pools (like
          # T3's) resolve identically to before.
          if [ -n "$MATCH" ]; then
            TAGS=$(printf '%s\n' "$TAGS" | grep -E -- "$MATCH" || true)
          fi
          if [ -n "$IGNORE" ]; then
            TAGS=$(printf '%s\n' "$TAGS" | grep -v -E -- "$IGNORE" || true)
          fi
          # Newest-first pick, case-insensitive so a capital-V tag (e.g.
          # V2.8.8) beats an older lowercase one. Original tag casing is
          # preserved for `git clone --branch`, which needs the exact case.
          TAG=$(printf '%s\n' "$TAGS" | awk 'NF { print tolower($0) "\t" $0 }' | sort -V -k1,1 | cut -f2- | tail -1 || true)
          if [ -n "$TAG" ]; then
            git clone --depth 1 --branch "$TAG" "$URL" build
            echo "$TAG" > upstream_tag.txt
          else
            git clone --depth 1 --branch "${{ steps.ctx.outputs.upstream_branch }}" "$URL" build
            echo "v0.0.0" > upstream_tag.txt
          fi
          echo "UPSTREAM_TAG=$(cat upstream_tag.txt)" >> "$GITHUB_ENV"

      - name: Skip tags that already have a build
        # Daily cron is a check, not a rebuild. A target is done when its
        # updater release exists: the legacy `v<tag>` form, or — when
        # upstream.json:version_suffix is set — the provenance
        # `v<tag>.<suffix>.<owner>.<n>` form. Hook-less targets are done
        # with the bundle alone. workflow_dispatch with force=true
        # rebuilds anyway.
        id: skip-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UP="$UPSTREAM_TAG"
          SLUG=$(echo "${{ matrix.pair.target }}" | awk -F/ '{print $(NF-1)"-"$NF}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-')
          UJSON="$GITHUB_WORKSPACE/forkhub/repos/${{ matrix.pair.target }}/upstream.json"
          SUFFIX=$(jq -r '.version_suffix // empty' "$UJSON")
          case "$SUFFIX" in
            "" | *[!a-z0-9-]*)
              [ -z "$SUFFIX" ] || echo "::warning::ignoring invalid version_suffix '$SUFFIX'"
              SUFFIX=""
              ;;
          esac
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          SKIP="false"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced rebuild of $UP"
          elif [ "$UP" = "v0.0.0" ]; then
            echo "no upstream tag; building branch fallback"
          else
            TAGS=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
            BASE=$(printf '%s' "$UP" | sed 's/^v//;s/\./\\./g')
            if [ -n "$SUFFIX" ] \
              && printf '%s\n' "$TAGS" | grep -qE "^v${BASE}[-.]${SUFFIX}\\.[a-z0-9-]+\\.[0-9]+\$"; then
              echo "$UP already has a $SUFFIX updater release; skipping"
              SKIP="true"
            elif [ -z "$SUFFIX" ] && printf '%s\n' "$TAGS" | grep -qxF "$UP"; then
              echo "$UP already has an updater release; skipping"
              SKIP="true"
            elif [ ! -f "forkhub/repos/${{ matrix.pair.target }}/build/publish.sh" ] \
              && printf '%s\n' "$TAGS" | grep -qF "$SLUG-$UP-fh"; then
              echo "$UP already has a bundle release; skipping"
              SKIP="true"
            else
              echo "$UP has no release yet; building"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Apply intent stack in manifest order + verify gate
        if: steps.skip-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Drift auto-triage (user-explicit: daily nightly pipeline must
          # reimplement and rebuild without a human in the loop). On apply
          # or verify failure, dispatches ONE `forkhub reimplement` run for
          # this target+patch+tag, then fails so the fresh realization
          # rebuilds on promote. Skips dispatch while a needs-human-decision
          # issue is already open for this patch (no daily agent spend
          # while a human decision is pending).
          dispatch_reimplement() {
            patch_id="$1"
            phase="$2"
            if gh issue list --repo "$GITHUB_REPOSITORY" --state open --label needs-human-decision               --search "in:title $patch_id" --json number --jq -e '.[0].number' >/dev/null 2>&1; then
              echo "needs-human-decision issue already open for $patch_id; not dispatching"
              return 0
            fi
            echo "dispatching forkhub reimplement for $patch_id @ $UPSTREAM_TAG ($phase failure)"
            gh workflow run "forkhub reimplement" --repo "$GITHUB_REPOSITORY" \
              -f target="${{ matrix.pair.target }}" -f patch="$patch_id" -f tag="$UPSTREAM_TAG" \
              || echo "::warning::reimplement dispatch failed for $patch_id"
          }

          set -euo pipefail
          # Absolute paths: git -C changes directory, so relative patch
          # paths would resolve inside the build checkout (bug).
          FH="$GITHUB_WORKSPACE/forkhub"
          BD="$GITHUB_WORKSPACE/build"
          for id in $(jq -r '.apply_order[]' "$FH/repos/${{ matrix.pair.target }}/manifest.json"); do
            p="$FH/repos/${{ matrix.pair.target }}/patches/$id"
            echo "→ $id"
            # Per-train realizations: a patch may carry reference.<train>.diff
            # (e.g. reference.stable.diff) for trees the default reference no
            # longer applies to. Default train always uses reference.diff.
            REF="$p/reference.diff"
            if [ "${{ matrix.pair.train }}" != "default" ] \
              && [ -f "$p/reference.${{ matrix.pair.train }}.diff" ]; then
              REF="$p/reference.${{ matrix.pair.train }}.diff"
              echo "using per-train reference for train ${{ matrix.pair.train }}"
            fi
            # Heal colored diffs captured with color.diff=always (CLI now
            # captures --no-color, but old intents may carry ANSI escapes).
            CLEAN="$(mktemp)"
            sed -e 's/\x1b\[[0-9;]*m//g' "$REF" > "$CLEAN"
            if ! grep -qE '^(diff --git |--- )' "$CLEAN"; then
              echo "::warning::$id reference.diff has no usable hunks — skipping (re-capture or re-derive)"
              continue
            fi
            if ! git -C "$BD" apply --check "$CLEAN"; then
              echo "::error::$id no longer applies to $UPSTREAM_TAG — drift detected"
              dispatch_reimplement "$id" "apply"
              exit 1
            fi
            git -C "$BD" apply "$CLEAN"
            # -f (not -x): verify.sh files are checked in non-executable.
            if [ -f "$p/verify.sh" ]; then
              if ! (cd "$BD" && sh "$p/verify.sh"); then
                echo "::error::$id verify failed on $UPSTREAM_TAG — drift detected"
                dispatch_reimplement "$id" "verify"
                exit 1
              fi
            fi
          done

      - name: Repo-native build (or source tarball fallback)
        if: steps.skip-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORKHUB_VERSION_SUFFIX: ${{ steps.skip-check.outputs.suffix }}
        run: |
          set -euo pipefail
          FH="$GITHUB_WORKSPACE/forkhub"
          BD="$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ -f "$FH/repos/${{ matrix.pair.target }}/build/build.sh" ]; then
            (cd "$BD" && sh "$FH/repos/${{ matrix.pair.target }}/build/build.sh")
          fi
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/dist")" ]; then
            # Default supports ANY repo type: ship the verified patched source.
            # A placeholder build.sh is a deliberate no-op, so fresh scaffolds
            # stay green until the agent fills in the repo-native build.
            SLUG=$(echo "${{ matrix.pair.target }}" | awk -F/ '{print $(NF-1)"-"$NF}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-')
            tar -czf "$GITHUB_WORKSPACE/dist/$SLUG-patched-source.tar.gz" -C "$BD" .
          fi
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum * > SHA256SUMS || shasum -a 256 * > SHA256SUMS)

      - name: Publish updater-channel release (target hook)
        # Optional per-target hook for updater feeds (e.g. electron-updater's
        # github provider, which resolves versions under `v<version>` tags and
        # cannot consume the namespaced *-fhN bundle tags below). Absent hook
        # = no updater release; the namespaced bundle still publishes.
        if: steps.skip-check.outputs.skip != 'true'
        working-directory: forkhub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HOOK="repos/${{ matrix.pair.target }}/build/publish.sh"
          if [ -f "$HOOK" ]; then
            TARGET="${{ matrix.pair.target }}" DIST="$GITHUB_WORKSPACE/dist" sh "$HOOK"
          else
            echo "no build/publish.sh for ${{ matrix.pair.target }}; skipping updater release"
          fi

      - name: Publish namespaced release
        if: steps.skip-check.outputs.skip != 'true'
        working-directory: forkhub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SLUG=$(echo "${{ matrix.pair.target }}" | awk -F/ '{print $(NF-1)"-"$NF}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-')
          UP="$UPSTREAM_TAG"
          N=1
          while gh release view "$SLUG-$UP-fh$N" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do N=$((N+1)); done
          TAG="$SLUG-$UP-fh$N"
          NOTES=$(mktemp)
          {
            echo "# $TAG"
            echo
            echo "Patched build of `${{ matrix.pair.target }}` @ `$UP` + intent stack."
            if [ -f "repos/${{ matrix.pair.target }}/build/CONSUME.md" ]; then
              echo
              cat "repos/${{ matrix.pair.target }}/build/CONSUME.md"
            fi
          } > "$NOTES"
          gh release create "$TAG" $GITHUB_WORKSPACE/dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$NOTES"
