name: forkhub build

# Hard-coded reusable builder for ALL intent-patched targets in this .forkhub repo.
# Per-target customization lives in repos/<host>/<owner>/<repo>/build/ (BUILD.md,
# build.sh, CONSUME.md, triggers.md) — never in this file. Safe to leave as-is.
#
# Triggers: push to repos/**, daily schedule (upstream-release polling), manual.
# The per-target build/triggers.md records the USER-EXPLICIT trigger choice
# (an agent must ask the user; triggers affect token/compute spend). To change
# the poll cadence, edit the cron below.
#
# Trains: a target lists release trains in upstream.json:trains
# (e.g. ["stable", "nightly"]); the build matrix fans out to one job per
# (target, train). Absent trains means ["default"]: legacy newest-tag behavior.
#
# Drift contract: when a patch no longer applies (or its verify fails) on
# a new tag, the build hands the pair off to `forkhub reimplement`
# (exactly-once per target+patch+tag) and the job step exits GREEN-as-
# triaged — drift with a live reimplement run is an expected pipeline
# state, not a build failure. The outcome lands in the per-pair drift
# ledger in the job summary; the authoritative per-patch record is
# attempts.jsonl (tag + SHA + prompt/model/variant + result). A red step
# means the handoff itself failed (dispatch suppressed/failed, no run
# in flight) and needs human attention.
#
# OS legs: a target lists builder OSs in upstream.json:build_runs_on
# (e.g. ["ubuntu-latest", "macos-14", "windows-latest"]); the matrix fans
# out to one job per (target, train, os). Absent means ["ubuntu-latest"]:
# legacy single-OS behavior. Each leg builds its native artifacts and
# uploads them into the SAME shared releases (per-OS skip markers in
# upstream.json:build_skip_markers, e.g. {"linux": "*.AppImage"},
# make resume/idempotence per-OS).

on:
  push:
    paths:
      - "repos/**"
  schedule:
    # 00:00 UTC+7 — nightly check while ImBIOS sleeps. The skip gate below
    # means this builds only tags with no release yet; manual dispatch
    # (+ force) covers everything else.
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Only build this target, e.g. github.com/owner/repo (empty = all)"
        required: false
        default: ""
      train:
        description: "Only build this train, e.g. stable (empty = all configured)"
        required: false
        default: ""
      force:
        description: "Rebuild even if this tag already has a release"
        required: false
        default: false
        type: boolean
      next_revision:
        description: "Cut a NEW provenance revision (N+1) instead of reusing the newest incomplete release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.list.outputs.builds }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: |
          set -euo pipefail
          FILTER="${{ inputs.target }}"
          TRAIN_FILTER="${{ inputs.train }}"
          BUILDS=$(for m in repos/*/*/*/manifest.json; do
            [ -f "$m" ] || continue
            t=$(dirname "$m" | sed 's|^repos/||')
            if [ -n "$FILTER" ] && [ "$t" != "$FILTER" ]; then continue; fi
            U="repos/$t/upstream.json"
            RUNS=$(jq -r '(.build_runs_on // ["ubuntu-latest"])[]' "$U")
            SOLE="true"
            [ "$(printf '%s\n' "$RUNS" | wc -l)" -gt 1 ] && SOLE="false" || true
            for train in $(jq -r '(.trains // ["default"])[]' "repos/$t/upstream.json"); do
              if [ -n "$TRAIN_FILTER" ] && [ "$train" != "$TRAIN_FILTER" ]; then continue; fi
              for os in $RUNS; do
                case "$os" in
                  ubuntu-*) os_key=linux;;
                  macos-*) os_key=mac;;
                  windows-*) os_key=win;;
                  *) os_key=linux;;
                esac
                jq -n --arg t "$t" --arg train "$train" --arg os "$os" \
                  --arg os_key "$os_key" --argjson sole "$SOLE" \
                  '{target: $t, train: $train, os: $os, os_key: $os_key, sole: $sole}'
              done
            done
          done | jq -cs .)
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.pair.target }} ${{ matrix.pair.train }} (${{ matrix.pair.os_key }})
    needs: [discover]
    if: needs.discover.outputs.builds != '[]'
    # Triaged drift exits the apply step 0: fail-fast=false + per-pair
    # jobs mean one pair's drift never blocks the others, and the green
    # job + drift-ledger row (not a red check) is the signal. A pair is
    # red ONLY when its handoff failed (see apply step) — that needs a
    # human, not a rebuild.
    strategy:
      fail-fast: false
      matrix:
        pair: ${{ fromJson(needs.discover.outputs.builds) }}
    runs-on: ${{ matrix.pair.os }}
    # Windows runners default to pwsh — every step below is POSIX sh.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          path: forkhub

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve upstream + patch stack
        id: ctx
        working-directory: forkhub
        run: |
          set -euo pipefail
          M="repos/${{ matrix.pair.target }}/manifest.json"
          U="repos/${{ matrix.pair.target }}/upstream.json"
          echo "upstream_url=$(jq -r .upstream_url "$U")" >> "$GITHUB_OUTPUT"
          echo "upstream_branch=$(jq -r '.upstream_main_branch // "main"' "$U")" >> "$GITHUB_OUTPUT"
          echo "order=$(jq -c .apply_order "$M")" >> "$GITHUB_OUTPUT"
          # Per-OS skip marker glob for this leg (empty = legacy behavior).
          echo "os_marker=$(jq -r --arg k "${{ matrix.pair.os_key }}" '.build_skip_markers[$k] // empty' "$U")" >> "$GITHUB_OUTPUT"
          # All markers ("os:glob ...") for the converge-numbering rule in
          # build.sh (empty = single-OS target, legacy numbering).
          echo "all_markers=$(jq -r '(.build_skip_markers // {}) | to_entries | map("\(.key):\(.value)") | join(" ")' "$U")" >> "$GITHUB_OUTPUT"

      - name: "Clone upstream at latest tag (fallback: main branch)"
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build" && mkdir -p "$GITHUB_WORKSPACE/build"
          URL="${{ steps.ctx.outputs.upstream_url }}"
          # GHA runners have no SSH keys: normalize git@host:owner/repo
          # to https for public clones.
          URL=$(printf '%s' "$URL" | sed -e 's|^git@\([^:]*\):|https://\1/|')
          # Train selection: upstream.json:trains fans the matrix out to one
          # job per (target, train). Each train brings default tag filters
          # (EREs for grep -E); explicit tag_match_pattern /
          # tag_ignore_pattern apply on top. Train "default" preserves
          # legacy behavior: newest tag of any train.
          UJSON="$GITHUB_WORKSPACE/forkhub/repos/${{ matrix.pair.target }}/upstream.json"
          case "${{ matrix.pair.train }}" in
            nightly) TRAIN_MATCH='-nightly\.[0-9]{8}\.'; TRAIN_IGNORE="";;
            stable) TRAIN_MATCH=""; TRAIN_IGNORE='-(nightly|preview)\.[0-9]{8}\.|-pr\.';;
            *) TRAIN_MATCH=""; TRAIN_IGNORE="";;
          esac
          MATCH=$(jq -r '.tag_match_pattern // empty' "$UJSON")
          IGNORE=$(jq -r '.tag_ignore_pattern // empty' "$UJSON")
          [ -n "$MATCH" ] || MATCH="$TRAIN_MATCH"
          [ -n "$IGNORE" ] || IGNORE="$TRAIN_IGNORE"
          # Tag pool: `refs/tags/v*` by default; a per-target
          # `tag_pool_prefix` (e.g. `"dsh-v"` for deepseek-harness, whose
          # tags never start with bare `v`) widens the pool to that
          # literal prefix instead. The per-target MATCH still decides.
          POOL_PREFIX=$(jq -r '.tag_pool_prefix // empty' "$UJSON")
          if [ -n "$POOL_PREFIX" ]; then
            POOL_RX=$(printf '%s' "$POOL_PREFIX" | sed 's/[^A-Za-z0-9_-]/\\&/g')
            TAGS=$(git ls-remote --tags --sort=-v:refname "$URL" \
              | grep -io "refs/tags/${POOL_RX}[^{}]*" | cut -d/ -f3 || true)
          else
            TAGS=$(git ls-remote --tags --sort=-v:refname "$URL" \
              | grep -io 'refs/tags/v[^^{}]*' | cut -d/ -f3 || true)
          fi
          # NOTE: the tag pool is case-insensitive (-i) so capital-V tags
          # (e.g. upstream Natively's V2.8.8) are visible, and the final
          # pick orders by lowercased version so the newest tag wins
          # regardless of case. Per-target MATCH/IGNORE patterns below stay
          # case-sensitive and still decide; uniform-lowercase pools (like
          # T3's) resolve identically to before.
          if [ -n "$MATCH" ]; then
            TAGS=$(printf '%s\n' "$TAGS" | grep -E -- "$MATCH" || true)
          fi
          if [ -n "$IGNORE" ]; then
            TAGS=$(printf '%s\n' "$TAGS" | grep -v -E -- "$IGNORE" || true)
          fi
          # Newest-first pick. Portable across GNU/BSD sort (macOS lacks
          # `sort -V`): natural version order via python3, case-insensitive
          # so a capital-V tag (e.g. V2.8.8) beats an older lowercase one.
          # Original tag casing is preserved for `git clone --branch`,
          # which needs the exact case.
          TAG=$(printf '%s\n' "$TAGS" | awk 'NF' | python3 -c "
          import sys, re
          def key(s):
              return [int(x) if x.isdigit() else x.lower() for x in re.split('([0-9]+)', s)]
          tags = sorted(set(l.rstrip('\n') for l in sys.stdin if l.strip()), key=key)
          print(tags[-1] if tags else '')
          " || true)
          if [ -n "$TAG" ]; then
            git clone --depth 1 --branch "$TAG" "$URL" build
            echo "$TAG" > upstream_tag.txt
          else
            git clone --depth 1 --branch "${{ steps.ctx.outputs.upstream_branch }}" "$URL" build
            echo "v0.0.0" > upstream_tag.txt
          fi
          echo "UPSTREAM_TAG=$(cat upstream_tag.txt)" >> "$GITHUB_ENV"

      - name: Skip tags that already have a build
        # Daily cron is a check, not a rebuild. A target is done when its
        # updater release exists: the legacy `v<tag>` form, or — when
        # upstream.json:version_suffix is set — the provenance
        # `v<tag>.<suffix>.<owner>.<n>` form. Hook-less targets are done
        # with the bundle alone. workflow_dispatch with force=true
        # rebuilds anyway.
        id: skip-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UP="$UPSTREAM_TAG"
          SLUG=$(echo "${{ matrix.pair.target }}" | awk -F/ '{print $(NF-1)"-"$NF}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-')
          UJSON="$GITHUB_WORKSPACE/forkhub/repos/${{ matrix.pair.target }}/upstream.json"
          SUFFIX=$(jq -r '.version_suffix // empty' "$UJSON")
          case "$SUFFIX" in
            "" | *[!a-z0-9-]*)
              [ -z "$SUFFIX" ] || echo "::warning::ignoring invalid version_suffix '$SUFFIX'"
              SUFFIX=""
              ;;
          esac
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          SKIP="false"
          OS_KEY="${{ matrix.pair.os_key }}"
          MARKER="${{ steps.ctx.outputs.os_marker }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced rebuild of $UP"
          elif [ "$UP" = "v0.0.0" ]; then
            echo "no upstream tag; building branch fallback"
          else
            TAGS=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
            BASE=$(printf '%s' "$UP" | sed 's/^v//;s/\./\\./g')
            if [ -n "$MARKER" ]; then
              # Multi-OS target: skip only when the newest matching updater
              # release already carries this OS leg's marker asset, so a
              # finished linux leg never blocks the mac/win legs (and a
              # resumed leg reuses the same release number — see build.sh).
              RX=$(printf '%s' "$MARKER" | sed 's/\./\\./g; s/\*/.*/g')
              # Portable newest-pick (no `sort -V` on macOS): matching tags
              # differ only in the trailing .N counter — order by it.
              LATEST=$(printf '%s\n' "$TAGS" | grep -E "^v${BASE}[-.]${SUFFIX}\\.[a-z0-9-]+\\.[0-9]+\$" | sed -E 's/^.*\.([0-9]+)$/\1 &/' | sort -n | tail -1 | sed -E 's/^[0-9]+ //' || true)
              if [ -n "$LATEST" ] \
                && gh release view "$LATEST" --repo "$GITHUB_REPOSITORY" --json assets \
                     --jq '.assets[].name' 2>/dev/null | grep -qE "^${RX}\$"; then
                echo "$UP already has $OS_KEY artifacts in $LATEST; skipping"
                SKIP="true"
              else
                echo "$UP has no $OS_KEY artifacts yet; building"
              fi
            elif [ -n "$SUFFIX" ] \
              && printf '%s\n' "$TAGS" | grep -qE "^v${BASE}[-.]${SUFFIX}\\.[a-z0-9-]+\\.[0-9]+\$"; then
              echo "$UP already has a $SUFFIX updater release; skipping"
              SKIP="true"
            elif [ -z "$SUFFIX" ] && printf '%s\n' "$TAGS" | grep -qxF "$UP"; then
              echo "$UP already has an updater release; skipping"
              SKIP="true"
            elif [ ! -f "forkhub/repos/${{ matrix.pair.target }}/build/publish.sh" ] \
              && printf '%s\n' "$TAGS" | grep -qF "$SLUG-$UP-fh"; then
              echo "$UP already has a bundle release; skipping"
              SKIP="true"
            else
              echo "$UP has no release yet; building"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Apply intent stack in manifest order + verify gate
        id: apply
        if: steps.skip-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Drift auto-triage (user-explicit: daily nightly pipeline must
          # reimplement and rebuild without a human in the loop). On apply
          # or verify failure, dispatches ONE `forkhub reimplement` run for
          # this target+patch+tag, then reports the job GREEN-as-triaged —
          # drift handed off to reimplement is an expected pipeline state,
          # not a build failure. The outcome is carried in the job-summary
          # drift ledger (jobs.<job>.conclusion stays success; per-pair
          # rows show reimplement-dispatched vs genuine failure). Genuine
          # failures (dispatch suppressed/failed, no reimplement run for
          # this pair) still exit 1. Skips dispatch while a
          # needs-human-decision issue is already open for this patch (no
          # daily agent spend while a human decision is pending).
          # GITHUB_STEP_SUMMARY note: the ledger is advisory only — the
          # authoritative record per patch/tag is attempts.jsonl (written
          # by reimplement-router.sh), keyed by upstream tag + SHA.
          DRIFT_LEDGER="$(mktemp)"
          echo "DRIFT_LEDGER=$DRIFT_LEDGER" >> "$GITHUB_ENV"
          drift_ledger() {
            printf '%s | %s | %s | %s | %s\n' "${{ matrix.pair.target }}" \
              "${{ matrix.pair.train }}" "${{ matrix.pair.os_key }}" "$1" "$2" >> "$DRIFT_LEDGER"
          }
          # Drift handoff dedupe: a reimplement run dispatched by an EARLIER
          # build in this same drift episode already owns the pair. Treat a run
          # in_progress for THIS tag as "owned" — the step exits 0 without
          # dispatching a duplicate; the owner run's outcome is the signal.
          # Only when NO run exists for the pair do we dispatch and hand
          # off. The tag match is anchored ($-suffixed) so 20261104.4151
          # does not match a shorter/longer tag.
          owned_run() {
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "forkhub reimplement" \
              --status in_progress --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | test(\"$UPSTREAM_TAG\" + \"\$\")) | .databaseId" 2>/dev/null \
              | head -1
          }
          dispatch_reimplement() {
            patch_id="$1"
            phase="$2"
            # Dedupe: one reimplement run per target+patch+tag, and never
            # while a human decision is pending for this patch (no daily
            # agent spend waiting on an answer). Without this, N parallel
            # build legs failing on the same drift dispatch N agents that
            # all push to main and all but one die with "fetch first".
            if gh issue list --repo "$GITHUB_REPOSITORY" --state open --label needs-human-decision               --search "in:title $patch_id" --json number --jq -e '.[0].number' >/dev/null 2>&1; then
              echo "needs-human-decision issue already open for $patch_id; not dispatching"
              drift_ledger "$patch_id" "needs-human-decision-open"
              return 1
            fi
            PENDING=$(owned_run)
            if [ -n "${PENDING:-}" ]; then
              echo "run $PENDING already owns $UPSTREAM_TAG; handed off, awaiting its outcome (triaged)"
              drift_ledger "$patch_id" "reimplement-owns-$PENDING"
              return 0
            fi
            echo "dispatching forkhub reimplement for $patch_id @ $UPSTREAM_TAG ($phase failure)"
            if gh workflow run "forkhub reimplement" --repo "$GITHUB_REPOSITORY" \
              -f target="${{ matrix.pair.target }}" -f patch="$patch_id" -f tag="$UPSTREAM_TAG"; then
              drift_ledger "$patch_id" "reimplement-dispatched"
              return 0
            else
              echo "::warning::reimplement dispatch failed for $patch_id"
              drift_ledger "$patch_id" "dispatch-failed"
              return 1
            fi
          }

          set -euo pipefail
          # Absolute paths: git -C changes directory, so relative patch
          # paths would resolve inside the build checkout (bug).
          FH="$GITHUB_WORKSPACE/forkhub"
          BD="$GITHUB_WORKSPACE/build"
          for id in $(jq -r '.apply_order[]' "$FH/repos/${{ matrix.pair.target }}/manifest.json" | tr -d '\r'); do
            p="$FH/repos/${{ matrix.pair.target }}/patches/$id"
            echo "→ $id"
            # Per-train realizations: a patch may carry reference.<train>.diff
            # (e.g. reference.stable.diff) for trees the default reference no
            # longer applies to. Default train always uses reference.diff.
            REF="$p/reference.diff"
            if [ "${{ matrix.pair.train }}" != "default" ] \
              && [ -f "$p/reference.${{ matrix.pair.train }}.diff" ]; then
              REF="$p/reference.${{ matrix.pair.train }}.diff"
              echo "using per-train reference for train ${{ matrix.pair.train }}"
            fi
            # Heal colored diffs captured with color.diff=always (CLI now
            # captures --no-color, but old intents may carry ANSI escapes).
            CLEAN="$(mktemp)"
            sed -e 's/\x1b\[[0-9;]*m//g' "$REF" > "$CLEAN"
            if ! grep -qE '^(diff --git |--- )' "$CLEAN"; then
              echo "::warning::$id reference.diff has no usable hunks — skipping (re-capture or re-derive)"
              continue
            fi
            if ! git -C "$BD" apply --check "$CLEAN"; then
              echo "::error::$id no longer applies to $UPSTREAM_TAG — drift detected"
              if dispatch_reimplement "$id" "apply"; then
                # Drift handed off to reimplement: expected pipeline
                # state, not a build failure. Skip the remaining steps for
                # this pair; the promoted realization rebuilds next run.
                echo "::notice::$id handed to forkhub reimplement — triaged, not failed"
                echo "triaged=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::$id drift could not be handed off (see drift ledger) — genuine failure"
              exit 1
            fi
            git -C "$BD" apply "$CLEAN"
            # -f (not -x): verify.sh files are checked in non-executable.
            if [ -f "$p/verify.sh" ]; then
              if ! (cd "$BD" && sh "$p/verify.sh"); then
                echo "::error::$id verify failed on $UPSTREAM_TAG — drift detected"
                if dispatch_reimplement "$id" "verify"; then
                  # Same triage contract as the apply path above.
                  echo "::notice::$id handed to forkhub reimplement — triaged, not failed"
                  echo "triaged=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                echo "::error::$id drift could not be handed off (see drift ledger) — genuine failure"
                exit 1
              fi
            fi
          done
          echo "triaged=false" >> "$GITHUB_OUTPUT"

      - name: Publish drift ledger to job summary
        # Always runs: records per-pair drift outcome so the green check
        # distinguishes "built" from "triaged to reimplement". Ledger rows
        # are advisory; attempts.jsonl is the authoritative record.
        if: always()
        run: |
          {
            echo "### Drift ledger — ${{ matrix.pair.target }} ${{ matrix.pair.train }} (${{ matrix.pair.os_key }}) @ ${UPSTREAM_TAG:-unknown}"
            echo
            echo "| target | train | os | patch | outcome |"
            echo "|---|---|---|---|---|"
            if [ -s "$DRIFT_LEDGER" ]; then
              sed 's/^/| /; s/ | / | /g; s/$/ |/' "$DRIFT_LEDGER"
            else
              printf '| %s | %s | %s | — | no drift (built or skipped) |\n' \
                "${{ matrix.pair.target }}" "${{ matrix.pair.train }}" "${{ matrix.pair.os_key }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Repo-native build (or source tarball fallback)
        # Skipped when drift was triaged to reimplement (nothing verified
        # to build); the promoted realization rebuilds on the next run.
        if: steps.skip-check.outputs.skip != 'true' && steps.apply.outputs.triaged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORKHUB_VERSION_SUFFIX: ${{ steps.skip-check.outputs.suffix }}
          # Per-target secret forwarding (sanctioned pattern — keep this list
          # minimal and documented): build.sh scripts read these at package
          # time. Absent secret = empty env = the target's unconfigured path.
          # Natively calendar direct flow: Google OAuth client id (public,
          # baked into extraMetadata) + client secret (optional since
          # v1.1.0 — fork Desktop client connects secretless; baked only
          # when provisioned, never logged by build.sh). Add the values in
          # repo Settings → Secrets (CLIENT_ID as a secret for uniformity,
          # or set NATIVELY_GOOGLE_CLIENT_ID as a variable); the names alone
          # are safe to keep here.
          NATIVELY_GOOGLE_CLIENT_ID: ${{ secrets.NATIVELY_GOOGLE_CLIENT_ID }}
          NATIVELY_GOOGLE_CLIENT_SECRET: ${{ secrets.NATIVELY_GOOGLE_CLIENT_SECRET }}
          # OpenDia resign pipeline: AMO JWT for `web-ext sign
          # --channel=unlisted` (repo Settings → Secrets; absent = build.sh
          # soft-fails with a patched-source bundle). Same sanctioned
          # per-target forwarding pattern as above.
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          # Target slug for per-target bundle numbering (see build.sh).
          FORKHUB_TARGET: ${{ matrix.pair.target }}
          # OS leg identity for multi-OS targets (see build.sh numbering
          # reuse + per-OS checksums). Single-OS targets ignore these.
          FORKHUB_OS_KEY: ${{ matrix.pair.os_key }}
          FORKHUB_OS_MARKER: ${{ steps.ctx.outputs.os_marker }}
          FORKHUB_ALL_MARKERS: ${{ steps.ctx.outputs.all_markers }}
          FORKHUB_OS_SOLE: ${{ matrix.pair.sole }}
          # Opt-in revision bump (workflow_dispatch next_revision=true):
          # cut a fresh provenance number even when the newest release is
          # incomplete (the converge rule would otherwise reuse it). Used
          # to re-stamp SAME-content rebuilds as N+1 so updaters see a
          # newer version instead of same-number/new-bytes.
          FORKHUB_NEXT_REVISION: ${{ inputs.next_revision }}
        run: |
          set -euo pipefail
          FH="$GITHUB_WORKSPACE/forkhub"
          BD="$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ -f "$FH/repos/${{ matrix.pair.target }}/build/build.sh" ]; then
            (cd "$BD" && sh "$FH/repos/${{ matrix.pair.target }}/build/build.sh")
          fi
          if [ -z "$(ls -A "$GITHUB_WORKSPACE/dist")" ]; then
            # Default supports ANY repo type: ship the verified patched source.
            # A placeholder build.sh is a deliberate no-op, so fresh scaffolds
            # stay green until the agent fills in the repo-native build.
            SLUG=$(echo "${{ matrix.pair.target }}" | awk -F/ '{print $(NF-1)"-"$NF}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-')
            tar -czf "$GITHUB_WORKSPACE/dist/$SLUG-patched-source.tar.gz" -C "$BD" .
          fi
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum * > SHA256SUMS || shasum -a 256 * > SHA256SUMS)
          # Multi-OS legs share one bundle release: a single SHA256SUMS would
          # be clobbered per leg, so each leg also ships a per-OS copy that
          # covers exactly its own files (sole-leg targets keep legacy shape).
          if [ "${{ matrix.pair.sole }}" != "true" ]; then
            cp "$GITHUB_WORKSPACE/dist/SHA256SUMS" "$GITHUB_WORKSPACE/dist/SHA256SUMS-${{ matrix.pair.os_key }}"
          fi

      - name: Publish updater-channel release (target hook)
        # Optional per-target hook for updater feeds (e.g. electron-updater's
        # github provider, which resolves versions under `v<version>` tags and
        # cannot consume the namespaced *-fhN bundle tags below). Absent hook
        # = no updater release; the namespaced bundle still publishes.
        if: steps.skip-check.outputs.skip != 'true' && steps.apply.outputs.triaged != 'true'
        working-directory: forkhub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HOOK="repos/${{ matrix.pair.target }}/build/publish.sh"
          if [ -f "$HOOK" ]; then
            TARGET="${{ matrix.pair.target }}" DIST="$GITHUB_WORKSPACE/dist" sh "$HOOK"
          else
            echo "no build/publish.sh for ${{ matrix.pair.target }}; skipping updater release"
          fi

      - name: Publish namespaced release
        if: steps.skip-check.outputs.skip != 'true' && steps.apply.outputs.triaged != 'true'
        working-directory: forkhub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SLUG=$(echo "${{ matrix.pair.target }}" | awk -F/ '{print $(NF-1)"-"$NF}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-')
          UP="$UPSTREAM_TAG"
          N=1
          while gh release view "$SLUG-$UP-fh$N" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do N=$((N+1)); done
          TAG="$SLUG-$UP-fh$N"
          NOTES=$(mktemp)
          {
            echo "# $TAG"
            echo
            echo "Patched build of \`${{ matrix.pair.target }}\` @ \`$UP\` + intent stack."
            if [ -f "repos/${{ matrix.pair.target }}/build/CONSUME.md" ]; then
              echo
              cat "repos/${{ matrix.pair.target }}/build/CONSUME.md"
            fi
          } > "$NOTES"
          # Filenames may contain spaces (Windows portable exe is
          # "<product> <version>.exe"), so uploads use a bash array —
          # never a flat string. while-read (not mapfile) for bash 3.2
          # on macOS runners.
          upload_leg_files() {
            local tag="$1"
            local files=()
            if [ "${{ matrix.pair.sole }}" = "true" ]; then
              # Sole-leg targets keep the legacy shape (SHA256SUMS included).
              local f
              for f in "$GITHUB_WORKSPACE"/dist/*; do
                [ -e "$f" ] || continue
                files+=("$f")
              done
            else
              # Multi-OS legs share one bundle release: a bare SHA256SUMS
              # would clobber a sibling leg's, so exclude it — per-OS
              # SHA256SUMS-<os> copies cover each leg's own files.
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                files+=("$GITHUB_WORKSPACE/dist/$f")
              done < <(cd "$GITHUB_WORKSPACE/dist" && ls * 2>/dev/null | grep -vx 'SHA256SUMS' || true)
            fi
            if [ "${#files[@]}" -gt 0 ]; then
              gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "no bundle files to upload"
            fi
          }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Multi-OS legs share one bundle release: upload this leg's
            # files into it.
            upload_leg_files "$TAG"
          else
            gh release create "$TAG" $GITHUB_WORKSPACE/dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$NOTES" \
              || {
                # Lost a race with a parallel leg that created it first.
                echo "create raced; uploading into existing $TAG"
                sleep 10
                upload_leg_files "$TAG"
              }
          fi
